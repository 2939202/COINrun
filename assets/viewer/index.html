<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; }
</style>
<script>
  // 모듈 스크립트가 뜨기도 전에 난 오류도 앱에 알립니다. (앱은 "보이지 않아요"를 띄웁니다)
  const report = (m) => window.Flutter && window.Flutter.postMessage('error:' + m);
  window.addEventListener('error', (e) => report(e.message || 'script'));
  window.addEventListener('unhandledrejection', (e) => report(String(e.reason)));
</script>
<script type="importmap">
  { "imports": { "three": "./three.module.min.js" } }
</script>
</head>
<body>
<script type="module">
// ============================================================
// 3D 캐릭터 뷰어 (lib/widgets/character_view.dart가 띄웁니다)
//
// 앱 안의 작은 서버(lib/services/asset_server.dart)에서 이 파일과 모델을 받습니다.
// three.js r160 (MIT)을 assets/viewer/에 같이 넣어 둬서 인터넷 없이도 뜹니다.
//
// 두 가지로 씁니다.
//   ?me=head,ArmLeg,fabric              내 캐릭터 화면. 한 명이 가만히 서 있습니다.
//   ?me=...&foe=womanHEAD,armor         게임 플레잉 대결. 두 명이 마주 봅니다.
//   ?me=...&foe=...&pair=1              캐릭터 고르기. 두 명이 나란히 앞을 봅니다.
//   ?me=...&face=1                      홈 카드. 얼굴만 크게 보입니다.
//
// 그림체: 작은 화면에 그린 다음 네모 픽셀 그대로 키워서 픽셀 느낌을 내고,
// 캐릭터 위에만 잔잔한 노이즈를 깔아 자글자글하게 합니다. (아래 "필터")
//
// 앱 → 뷰어:  setFighters(['head',...], ['womanHEAD',...] 또는 null)
//             strike(true=내가 침, landed=맞았는지)
// 손가락:     내 캐릭터 화면에서 가로로 끌면 돌고, 빠르게 두 번 치면 붉어지며 콩콩 뜁니다.
// 뷰어 → 앱:  Flutter.postMessage('ready' | 'error:...')
//
// 숨쉬기·때리기·맞기는 뼈대 없이 캐릭터 전체를 움직여서 만듭니다. 발바닥이 기준점입니다.
// ============================================================
import * as THREE from 'three';
import { GLTFLoader } from './GLTFLoader.js';

const params = new URLSearchParams(location.search);
const send = (message) => window.Flutter?.postMessage(message);
const listOf = (value) => (value || '').split(',').filter(Boolean);

const FACE_ONLY = Boolean(params.get('face'));

// 픽셀 느낌을 내려고 계단 현상을 일부러 남깁니다. (antialias 끔)
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.01, 100);

scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a6a3e, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(1.5, 3, 2.5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xfff1dc, 0.7);
rim.position.set(-2, 1.5, -2);
scene.add(rim);

// ---------- 필터 ----------
// 1) 캐릭터를 작은 그림(low)에 그립니다. 픽셀 한 칸 = 화면 PIXEL px
// 2) 그 그림을 가장 가까운 칸 그대로(Nearest) 화면 크기로 키웁니다.
// 3) 키우면서 색 단계를 줄이고, 칸마다 노이즈를 1초에 12번 바꿔 얹습니다.
//    노이즈는 캐릭터가 있는 칸에만 얹어서 배경은 깨끗합니다.
const PIXEL = 2;
const low = new THREE.WebGLRenderTarget(1, 1, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
});
const filter = new THREE.ShaderMaterial({
  uniforms: {
    image: { value: low.texture },
    size: { value: new THREE.Vector2(1, 1) },
    seed: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D image;
    uniform vec2 size;
    uniform float seed;
    varying vec2 vUv;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233)) + seed) * 43758.5453); }
    void main() {
      vec4 c = texture2D(image, vUv);
      vec2 cell = floor(vUv * size);
      // 화면 밝기(sRGB)로 바꾼 뒤에 노이즈를 얹어야 어두운 옷에서 튀지 않습니다.
      vec3 col = pow(max(c.rgb, 0.0), vec3(1.0 / 2.2));
      col += (hash(cell) - 0.5) * 0.07;
      col = floor(col * 24.0 + 0.5) / 24.0;
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), c.a);
    }`,
  depthTest: false,
  depthWrite: false,
  blending: THREE.NoBlending,
});
const screen = new THREE.Scene();
screen.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), filter));
const screenCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const ease = (x) => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const red = new THREE.Color(0xd33a2a);

// ---------- 캐릭터 한 명 ----------
// stand: 서 있는 자리와 방향, rig: 동작을 거는 곳, model: 파일에서 읽은 파츠 묶음
class Figure {
  constructor(source) {
    this.stand = new THREE.Group();
    this.rig = new THREE.Group();
    this.model = source.clone();
    this.model.traverse((object) => {
      // 머티리얼을 캐릭터마다 따로 둬서 한 명이 맞을 때 다른 사람까지 붉어지지 않게 합니다.
      if (object.isMesh) object.material = object.material.clone();
    });
    this.parts = {};
    for (const child of this.model.children) this.parts[child.name] = child;
    this.rig.add(this.model);
    this.stand.add(this.rig);
    scene.add(this.stand);
    this.height = 1;
    this.action = null; // { name: 'attack' | 'hit' | 'dodge' | 'poke', start }
    this.breath = Math.random() * 3; // 두 사람이 똑같이 숨 쉬지 않게 시작점을 엇갈립니다.
  }

  setOutfit(names) {
    const on = new Set(names);
    for (const [name, object] of Object.entries(this.parts)) object.visible = on.has(name);
    this.fit();
  }

  // 보이는 파츠만 재서 발바닥이 0, 가운데가 x=z=0이 되게 옮깁니다.
  // 숨긴 파츠는 자리가 조금씩 달라서 같이 재면 한쪽으로 치우칩니다.
  fit() {
    this.model.position.set(0, 0, 0);
    this.model.updateMatrixWorld(true);
    const toModel = this.model.matrixWorld.clone().invert();
    const box = new THREE.Box3();
    for (const part of Object.values(this.parts)) {
      if (!part.visible) continue;
      part.traverse((object) => {
        if (!object.isMesh) return;
        if (!object.geometry.boundingBox) object.geometry.computeBoundingBox();
        box.union(object.geometry.boundingBox.clone()
          .applyMatrix4(toModel.clone().multiply(object.matrixWorld)));
      });
    }
    if (box.isEmpty()) return;
    const center = box.getCenter(new THREE.Vector3());
    this.model.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
    this.height = box.max.y - box.min.y;
  }

  play(name, delay = 0) {
    this.action = { name, start: performance.now() / 1000 + delay };
  }

  update(t) {
    const H = this.height;
    // 가만히 있을 때도 숨을 쉽니다. (2.8초에 한 번, 키가 1%쯤 늘었다 줄었다)
    const breathe = Math.sin((t + this.breath) * Math.PI * 2 / 2.8);
    const p = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0.008 * breathe, sy: 1 + 0.011 * breathe };
    let flash = 0;
    const a = this.action;
    const u = a ? t - a.start : -1;
    if (a && u >= 0) {
      if (a.name === 'attack') {
        // 0~0.18 뒤로 젖혔다가, 0.18~0.3 앞으로 확, 0.3~0.6 돌아오기
        const windup = u < 0.18 ? ease(u / 0.18) : Math.max(0, 1 - (u - 0.18) / 0.08);
        const lunge = u < 0.18 ? 0 : u < 0.3 ? ease((u - 0.18) / 0.12) : 1 - ease((u - 0.3) / 0.3);
        p.rx = -0.18 * windup + 0.32 * lunge;
        p.ry = -0.35 * windup + 0.25 * lunge;
        p.z = -0.03 * H * windup + 0.3 * H * lunge;
        p.sy *= 1 + 0.04 * lunge;
      } else if (a.name === 'hit') {
        // 뒤로 밀리면서 흔들리고 붉게 번쩍
        const knock = u < 0.1 ? ease(u / 0.1) : 1 - ease((u - 0.1) / 0.5);
        p.z = -0.12 * H * knock;
        p.rx = -0.22 * knock;
        p.rz += 0.12 * knock;
        p.x = 0.02 * H * Math.sin(u * 70) * Math.max(0, 1 - u / 0.4);
        p.sy *= 1 - 0.05 * knock;
        flash = Math.max(0, 1 - u / 0.35);
      } else if (a.name === 'poke') {
        // 두 번 톡: 붉게 번쩍이고 제자리에서 콩콩 세 번 뜁니다. (약 1초)
        const hops = Math.abs(Math.sin(Math.PI * 3 * u / 0.95));
        p.y = 0.09 * H * hops * Math.max(0, 1 - u / 1.1);
        p.sy *= 1 - 0.05 * (1 - hops) * (u < 0.95 ? 1 : 0);
        p.rz += 0.06 * Math.sin(Math.PI * 3 * u / 0.95);
        flash = Math.max(0, 1 - u / 0.5);
      } else {
        // 피하기: 옆으로 쏙 빠졌다 돌아오기
        const side = u < 0.15 ? ease(u / 0.15) : 1 - ease((u - 0.15) / 0.35);
        p.x = 0.18 * H * side;
        p.rz = -0.12 * side;
      }
      if (u > (a.name === 'poke' ? 1.0 : 0.6)) this.action = null;
    }
    this.rig.position.set(p.x, p.y, p.z);
    this.rig.rotation.set(p.rx, p.ry, p.rz);
    this.rig.scale.set(1 / Math.sqrt(p.sy), p.sy, 1 / Math.sqrt(p.sy));
    this.rig.traverse((object) => {
      if (object.isMesh && object.visible && object.material.emissive) {
        object.material.emissive.copy(red).multiplyScalar(flash * 0.8);
      }
    });
  }
}

// ---------- 장면 ----------
let source = null;
let me = null;
let foe = null;

// 내 캐릭터 화면에서는 정면보다 조금 돌려 세웁니다. 대결에서는 서로 마주 봅니다.
const SOLO_ANGLE = -0.35;
// 대결에서는 상대 쪽으로 크게 돌고, 고르기 화면에서는 앞을 보며 살짝만 안쪽으로 돕니다.
const FACE = params.get('pair') ? 0.3 : 0.85;

function setFighters(mine, theirs) {
  if (!source) return;
  me ??= new Figure(source);
  me.setOutfit(mine);
  if (theirs && theirs.length) {
    foe ??= new Figure(source);
    foe.setOutfit(theirs);
  } else if (foe) {
    scene.remove(foe.stand);
    foe = null;
  }
  layout();
}

// 내가 쳤는지(byMe), 맞았는지(landed). 맞으면 상대가 밀리고, 아니면 피합니다.
function strike(byMe, landed) {
  if (!foe) return;
  const [hitter, target] = byMe ? [me, foe] : [foe, me];
  hitter.play('attack');
  target.play(landed ? 'hit' : 'dodge', 0.22);
}

window.setFighters = setFighters;
window.strike = strike;

let angle = SOLO_ANGLE;

function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  renderer.setSize(Math.round(w * dpr), Math.round(h * dpr), false);
  const lw = Math.max(1, Math.round(w / PIXEL)), lh = Math.max(1, Math.round(h / PIXEL));
  low.setSize(lw, lh);
  filter.uniforms.size.value.set(lw, lh);
  camera.aspect = w / h;
  const H = Math.max(me?.height ?? 1, foe?.height ?? 0);
  // 가운데에서 한 사람까지의 거리. 고르기 화면은 세로로 길어서 더 붙여 세웁니다.
  const gap = H * (params.get('pair') ? 0.36 : 0.5);
  if (foe) {
    me.stand.position.set(-gap, 0, 0);
    me.stand.rotation.y = FACE;
    foe.stand.position.set(gap, 0, 0);
    foe.stand.rotation.y = -FACE;
  } else if (me) {
    me.stand.position.set(0, 0, 0);
    me.stand.rotation.y = angle;
  }
  const fov = THREE.MathUtils.degToRad(camera.fov);
  if (FACE_ONLY) {
    // 머리(키의 위쪽 40% 정도)만 화면에 차게
    const fit = Math.max(H * 0.56, (H * 0.56) / camera.aspect);
    const distance = fit / (2 * Math.tan(fov / 2));
    camera.position.set(0, H * 0.75, distance);
    camera.lookAt(0, H * 0.74, 0);
  } else {
    // 머리부터 발까지 들어오고 위아래로 조금 여유가 남는 거리
    const wide = foe ? gap * 2 + H * 0.7 : H * 0.9;
    const fit = Math.max(H * (foe ? 1.12 : 1.2), wide / camera.aspect);
    const distance = fit / (2 * Math.tan(fov / 2));
    camera.position.set(0, H * 0.5, distance);
    camera.lookAt(0, H * 0.48, 0);
  }
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', layout);

// ---------- 손가락으로 돌리기 (내 캐릭터 화면, 가로로만) ----------
let dragX = null, spin = 0;
let lastTap = 0, tapX = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  dragX = e.clientX;
  spin = 0;
  // 0.3초 안에 같은 자리를 두 번 치면 콩콩
  const now = performance.now();
  if (!foe && me && now - lastTap < 300 && Math.abs(e.clientX - tapX) < 30) {
    me.play('poke');
    lastTap = 0;
  } else {
    lastTap = now;
    tapX = e.clientX;
  }
});
window.addEventListener('pointermove', (e) => {
  if (dragX === null) return;
  spin = (e.clientX - dragX) * 0.012;
  dragX = e.clientX;
  angle += spin;
});
window.addEventListener('pointerup', () => { dragX = null; });
window.addEventListener('pointercancel', () => { dragX = null; });

function animate(ms) {
  const t = ms / 1000;
  if (!foe && me) {
    if (dragX === null) {
      // 놓으면 조금 미끄러지다가 그 방향에 멈춰 섭니다.
      spin *= 0.9;
      angle += spin;
    }
    me.stand.rotation.y = angle;
  }
  me?.update(t);
  foe?.update(t);
  filter.uniforms.seed.value = Math.floor(t * 12) % 97; // 노이즈를 1초에 12번 바꿉니다
  renderer.setRenderTarget(low);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(screen, screenCamera);
  requestAnimationFrame(animate);
}

new GLTFLoader().load(
  '../models/character.glb',
  (gltf) => {
    source = gltf.scene;
    source.traverse((object) => {
      if (object.isMesh && object.material.metalnessMap === null) object.material.metalness = 0;
    });
    setFighters(listOf(params.get('me')), listOf(params.get('foe')));
    requestAnimationFrame(animate);
    send('ready');
  },
  undefined,
  (error) => send('error:' + (error?.message || error)),
);
</script>
</body>
</html>
