<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코인런 친구 초대</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 18px; background: #1B1714; color: #ECDDBE;
         font-family: -apple-system, 'Noto Sans KR', sans-serif; text-align: center; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; color: #B8A98C; font-size: 14px; }
  a.btn { padding: 14px 28px; border-radius: 999px; background: #9A8158; color: #1B1714;
          font-weight: 700; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<h1>코인런 친구 초대</h1>
<p>버튼을 누르면 코인런 앱이 열리고 친구 요청을 보낼 수 있어요.</p>
<a class="btn" id="open" href="#">코인런에서 열기</a>
<p>앱이 안 열리면 코인런을 먼저 설치해 주세요.</p>
<script>
  // /p/<uid> -> 앱 링크 coinrun://app/player/<uid>
  var uid = location.pathname.replace(/^\/p\/?/, '').split('/')[0];
  var link = 'coinrun://app/player/' + encodeURIComponent(uid);
  // 안드로이드 크롬·카톡 인앱 브라우저는 intent:// 로 앱을 엽니다.
  var intent = 'intent://app/player/' + encodeURIComponent(uid) +
      '#Intent;scheme=coinrun;package=com.example.contact;end';
  var href = /android/i.test(navigator.userAgent) ? intent : link;
  document.getElementById('open').href = href;
  if (uid) location.href = href;
</script>
</body>
</html>
