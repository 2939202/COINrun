<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 A · 스포츠 미니멀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#FFFFFF; --ink:#111111; --sub:#8D8D8D; --line:#ECECEC; --card:#F5F5F5;
    --volt:#D4FF3A; --page:#E9E9E6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,system-ui,sans-serif;background:var(--page);color:var(--ink);padding:40px 16px 60px}
  .intro{max-width:1140px;margin:0 auto 32px}
  .intro .tag{display:inline-block;background:var(--ink);color:var(--volt);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
  .intro h1{font-size:40px;font-weight:900;letter-spacing:-1.5px;margin:12px 0 8px}
  .intro p{color:#555;font-size:16px;line-height:1.6;max-width:720px}
  .intro ul{margin-top:12px;padding-left:18px;color:#555;line-height:1.8;font-size:15px}
  .row{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .shot{display:flex;flex-direction:column;align-items:center;gap:14px}
  .shot figcaption{font-weight:700;font-size:15px}
  .phone{width:360px;height:760px;border-radius:46px;border:10px solid #111;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.18)}
  .status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700}
  .scroll{padding:0 20px}

  /* 홈 */
  .top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
  .top .hi{font-size:13px;color:var(--sub);font-weight:600}
  .top .name{font-size:26px;font-weight:900;letter-spacing:-.5px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
  .coin{width:16px;height:16px;border-radius:50%;background:#FFC83D;border:2px solid #111}
  .hero{position:relative;height:300px;border-radius:24px;background:linear-gradient(160deg,#F4F4F2 0%,#E4E4DF 100%);overflow:hidden}
  .hero .lv{position:absolute;left:20px;top:16px}
  .hero .lv small{display:block;font-size:11px;font-weight:800;letter-spacing:3px;color:var(--sub)}
  .hero .lv b{font-size:76px;font-weight:900;line-height:.9;letter-spacing:-4px}
  .hero .tier{position:absolute;right:16px;top:18px;background:var(--volt);font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px}
  .hero svg{position:absolute;left:50%;bottom:34px;transform:translateX(-35%);height:230px}
  .hero .xp{position:absolute;left:20px;right:20px;bottom:16px}
  .bar{height:6px;border-radius:999px;background:rgba(0,0,0,.1);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
  .hero .xp span{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#555;margin-top:6px}
  .sec{font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--sub);margin:22px 0 10px}
  .stats{display:flex;justify-content:space-between}
  .stats div b{display:block;font-size:26px;font-weight:900;letter-spacing:-1px}
  .stats div span{font-size:12px;color:var(--sub);font-weight:600}
  .quest{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:18px;margin-top:4px}
  .quest .ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--ink) 0 62%,var(--line) 62% 100%);display:grid;place-items:center}
  .quest .ring::after{content:"";width:30px;height:30px;border-radius:50%;background:#fff}
  .quest b{font-size:15px}
  .quest p{font-size:12px;color:var(--sub);margin-top:2px}
  .quest em{margin-left:auto;font-style:normal;font-weight:800;font-size:13px}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:10px}
  .tabbar span{font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px}
  .tabbar span.on{color:var(--ink)}
  .tabbar .ico{width:22px;height:22px;border-radius:6px;border:2px solid currentColor}
  .start{width:66px;height:66px;border-radius:50%;background:var(--ink);color:var(--volt);font-weight:900;font-size:13px;display:grid;place-items:center;margin-top:-34px;box-shadow:0 8px 20px rgba(0,0,0,.25)}

  /* 러닝 */
  .map{height:390px;background:#EFEDE7;position:relative}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .map .back{position:absolute;left:16px;top:12px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .map .gps{position:absolute;right:16px;top:12px;background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .panel{padding:18px 22px 0;text-align:center}
  .panel .time{font-size:78px;font-weight:900;letter-spacing:-4px;line-height:1}
  .panel .label{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
  .panel .stats{margin:20px 4px 0;text-align:center}
  .reward{margin-top:18px;background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;display:flex;justify-content:space-between;font-weight:800;font-size:14px}
  .reward em{font-style:normal;color:var(--volt)}
  .ctrl{display:flex;justify-content:center;gap:26px;margin-top:22px}
  .ctrl div{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px}
  .ctrl .pause{background:var(--volt)}
  .ctrl .stop{border:2px solid var(--ink)}

  /* 캐릭터 */
  .charhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
  .charhead h2{font-size:24px;font-weight:900}
  .stage{height:250px;border-radius:24px;background:radial-gradient(circle at 50% 80%,#DCDCD6 0 30%,#F4F4F2 60%);position:relative}
  .stage svg{position:absolute;left:50%;bottom:18px;transform:translateX(-35%);height:210px}
  .stage .power{position:absolute;left:18px;top:16px}
  .stage .power small{font-size:11px;color:var(--sub);font-weight:800;letter-spacing:2px}
  .stage .power b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px}
  .statrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;font-weight:700}
  .statrow span{width:48px;color:var(--sub)}
  .statrow .bar{flex:1;height:8px}
  .statrow b{width:28px;text-align:right}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .slot{aspect-ratio:1;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;font-size:11px;font-weight:700;color:var(--sub)}
  .slot .gl{width:26px;height:26px;border-radius:8px;background:#fff;border:2px solid var(--ink)}
  .slot.eq{background:var(--ink);color:#fff}
  .slot.eq .gl{background:var(--volt);border-color:var(--volt)}
  .slot i{position:absolute;right:6px;top:5px;font-style:normal;font-size:10px;font-weight:900;color:var(--volt)}
  .cta{margin:18px 0 0;height:56px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px}
  .cta .coin{border-color:#fff}
</style>
</head>
<body>
<section class="intro">
  <span class="tag">시안 A</span>
  <h1>스포츠 미니멀</h1>
  <p>나이키 런클럽처럼 흑백 중심에 포인트 색 하나만 쓰는 방향입니다. 운동 앱의 신뢰감을 유지하면서, 지금 버전에 없던 <b>캐릭터를 홈 한가운데</b>에 두어 RPG라는 걸 바로 알 수 있게 했습니다.</p>
  <ul>
    <li>잘 맞는 사용자: 원래 러닝을 하던 사람, 운동 기록이 우선인 사람</li>
    <li>장점: 깔끔하고 고급스러움, 숫자가 잘 읽힘, 만들기 쉬움</li>
    <li>약점: 게임 같은 재미와 수집 욕구는 약함</li>
  </ul>
</section>

<svg width="0" height="0" style="position:absolute">
  <symbol id="runner" viewBox="0 0 200 260">
    <ellipse cx="100" cy="248" rx="54" ry="8" fill="rgba(0,0,0,.12)"/>
    <rect x="150" y="60" width="10" height="120" rx="4" fill="#9A9A9A" transform="rotate(20 155 120)"/>
    <rect x="78" y="168" width="20" height="66" rx="10" fill="#222"/>
    <rect x="103" y="168" width="20" height="66" rx="10" fill="#222"/>
    <rect x="68" y="226" width="34" height="16" rx="8" fill="#D4FF3A" stroke="#111" stroke-width="3"/>
    <rect x="100" y="226" width="34" height="16" rx="8" fill="#D4FF3A" stroke="#111" stroke-width="3"/>
    <rect x="46" y="108" width="20" height="62" rx="10" fill="#F2C9A0" transform="rotate(12 56 108)"/>
    <rect x="134" y="108" width="20" height="62" rx="10" fill="#F2C9A0" transform="rotate(-12 144 108)"/>
    <rect x="62" y="98" width="76" height="86" rx="28" fill="#111"/>
    <text x="100" y="152" text-anchor="middle" font-family="Pretendard" font-weight="900" font-size="26" fill="#D4FF3A">02</text>
    <circle cx="100" cy="64" r="40" fill="#F2C9A0"/>
    <path d="M60 60 Q64 20 100 22 Q138 20 140 60 Q126 44 100 44 Q76 44 60 60Z" fill="#2B2B2B"/>
    <rect x="60" y="46" width="80" height="11" rx="5" fill="#D4FF3A" stroke="#111" stroke-width="3"/>
    <circle cx="86" cy="72" r="4.5" fill="#111"/><circle cx="114" cy="72" r="4.5" fill="#111"/>
    <path d="M90 88 Q100 95 110 88" stroke="#111" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="row">
  <!-- 홈 -->
  <figure class="shot">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="scroll">
        <div class="top">
          <div><div class="hi">좋은 아침이에요</div><div class="name">러너1호</div></div>
          <span class="pill"><span class="coin"></span>1,274</span>
        </div>
        <div class="hero">
          <div class="lv"><small>LEVEL</small><b>2</b></div>
          <span class="tier">브론즈 러너</span>
          <svg><use href="#runner"/></svg>
          <div class="xp"><div class="bar"><i style="width:62%"></i></div><span><em style="font-style:normal">124 / 200 EXP</em><em style="font-style:normal">다음 레벨까지 8분</em></span></div>
        </div>
        <div class="sec">이번 주</div>
        <div class="stats">
          <div><b>12.4</b><span>킬로미터</span></div>
          <div><b>1:48</b><span>움직인 시간</span></div>
          <div><b>15,230</b><span>걸음</span></div>
        </div>
        <div class="sec">오늘의 목표</div>
        <div class="quest"><div class="ring"></div><div><b>3km 달리기</b><p>1.86 / 3.00 km</p></div><em>+100 G</em></div>
      </div>
      <div class="tabbar">
        <span class="on"><i class="ico"></i>홈</span>
        <span><i class="ico"></i>기록</span>
        <div class="start">START</div>
        <span><i class="ico"></i>상점</span>
        <span><i class="ico"></i>캐릭터</span>
      </div>
    </div>
    <figcaption>홈 — 캐릭터가 주인공</figcaption>
  </figure>

  <!-- 러닝 -->
  <figure class="shot">
    <div class="phone">
      <div class="map">
        <svg viewBox="0 0 340 390" preserveAspectRatio="none">
          <g stroke="#FFFFFF" stroke-width="14" fill="none"><path d="M-10 90 H350"/><path d="M-10 250 H350"/><path d="M80 -10 V400"/><path d="M250 -10 V400"/></g>
          <g stroke="#FFFFFF" stroke-width="6" fill="none"><path d="M-10 170 H350"/><path d="M165 -10 V400"/><path d="M-10 330 L350 300"/></g>
          <rect x="95" y="105" width="55" height="50" rx="6" fill="#DCE8D0"/><rect x="180" y="185" width="55" height="50" rx="6" fill="#DCE8D0"/>
          <path d="M80 360 V250 H165 V170 H250 V95" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="250" cy="95" r="11" fill="#111" stroke="#D4FF3A" stroke-width="6"/>
        </svg>
        <div class="back">←</div>
        <div class="gps">GPS 양호</div>
      </div>
      <div class="panel">
        <div class="time">05:32</div>
        <div class="label">시간</div>
        <div class="stats">
          <div><b>0.84</b><span>킬로미터</span></div>
          <div><b>1,102</b><span>걸음</span></div>
          <div><b>6'35"</b><span>페이스</span></div>
        </div>
        <div class="reward"><span>이번 러닝 보상</span><span><em>+55 EXP</em> · +110 G</span></div>
        <div class="ctrl"><div class="pause">II</div><div class="stop">완료</div></div>
      </div>
    </div>
    <figcaption>러닝 중 — 보상이 실시간으로 쌓임</figcaption>
  </figure>

  <!-- 캐릭터 -->
  <figure class="shot">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="scroll">
        <div class="charhead"><h2>내 캐릭터</h2><span class="pill"><span class="coin"></span>1,274</span></div>
        <div class="stage">
          <div class="power"><small>전투력</small><b>1,240</b></div>
          <svg><use href="#runner"/></svg>
        </div>
        <div class="sec">능력치</div>
        <div class="statrow"><span>힘</span><div class="bar"><i style="width:40%"></i></div><b>12</b></div>
        <div class="statrow"><span>지구력</span><div class="bar"><i style="width:65%"></i></div><b>19</b></div>
        <div class="statrow"><span>속도</span><div class="bar"><i style="width:30%"></i></div><b>9</b></div>
        <div class="sec">장비</div>
        <div class="slots">
          <div class="slot eq"><i>+3</i><span class="gl"></span>머리띠</div>
          <div class="slot eq"><i>+1</i><span class="gl"></span>상의</div>
          <div class="slot eq"><i>+5</i><span class="gl"></span>신발</div>
          <div class="slot"><span class="gl"></span>무기</div>
        </div>
        <div class="cta">신발 +6 강화하기 · <span class="coin"></span> 320</div>
      </div>
    </div>
    <figcaption>캐릭터 — 능력치와 장비 강화</figcaption>
  </figure>
</div>
</body>
</html>
