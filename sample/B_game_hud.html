<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 B · 다크 게임 HUD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#0B0E1A; --surface:#151A2E; --surface2:#1E2540; --line:#2A3252;
    --ink:#F2F4FF; --sub:#8A93B8; --cyan:#3DF5FF; --gold:#FFC845; --purple:#9B6BFF;
    --epic:#B06BFF; --rare:#4DA3FF; --page:#05070F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,system-ui,sans-serif;background:var(--page);color:var(--ink);padding:40px 16px 60px}
  .intro{max-width:1140px;margin:0 auto 32px}
  .intro .tag{display:inline-block;background:var(--cyan);color:#05070F;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
  .intro h1{font-size:40px;font-weight:900;letter-spacing:-1.5px;margin:12px 0 8px}
  .intro p{color:#B7BEDC;font-size:16px;line-height:1.6;max-width:720px}
  .intro ul{margin-top:12px;padding-left:18px;color:#B7BEDC;line-height:1.8;font-size:15px}
  .row{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .shot{display:flex;flex-direction:column;align-items:center;gap:14px}
  .shot figcaption{font-weight:700;font-size:15px;color:#B7BEDC}
  .phone{width:360px;height:760px;border-radius:46px;border:10px solid #22283F;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(61,245,255,.12)}
  .status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700}
  .scroll{padding:0 16px}

  /* 상단 HUD */
  .hud{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
  .avatar{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--cyan) 0 62%,var(--line) 62% 100%);display:grid;place-items:center;position:relative}
  .avatar::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface2)}
  .avatar b{position:relative;z-index:1;font-size:15px;font-weight:900}
  .hud .who b{display:block;font-size:16px;font-weight:800}
  .hud .who span{font-size:11px;color:var(--cyan);font-weight:700}
  .cur{margin-left:auto;display:flex;gap:6px}
  .cur span{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-weight:800;font-size:12px}
  .gem{width:12px;height:12px;transform:rotate(45deg);background:var(--purple);border-radius:2px}
  .coin{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(255,200,69,.6)}

  .arena{height:300px;border-radius:22px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 88%,rgba(61,245,255,.35) 0 18%,transparent 45%),radial-gradient(circle at 50% 30%,#1D2446 0,#0B0E1A 70%);border:1px solid var(--line)}
  .arena::before{content:"";position:absolute;left:50%;bottom:20px;width:190px;height:34px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(61,245,255,.6);box-shadow:0 0 30px rgba(61,245,255,.5)}
  .arena svg{position:absolute;left:50%;bottom:30px;transform:translateX(-38%);height:230px;filter:drop-shadow(0 0 18px rgba(155,107,255,.45))}
  .arena .cp{position:absolute;left:14px;top:14px}
  .arena .cp small{font-size:10px;color:var(--sub);font-weight:800;letter-spacing:2px}
  .arena .cp b{display:block;font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(255,200,69,.5)}
  .arena .grade{position:absolute;right:14px;top:14px;font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;background:rgba(61,245,255,.12);color:var(--cyan);border:1px solid rgba(61,245,255,.4)}
  .xpbar{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--sub)}
  .xpbar .bar{flex:1}
  .bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--cyan));box-shadow:0 0 10px var(--cyan)}
  .sec{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin:16px 0 8px}
  .sec span{font-size:11px;color:var(--sub);font-weight:700}
  .qst{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
  .qst .ic{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:18px}
  .qst .t{flex:1}
  .qst .t b{font-size:13px}
  .qst .t .bar{height:5px;margin-top:6px}
  .qst .rw{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--gold)}
  .qst.done{opacity:.55}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;background:linear-gradient(to top,#0B0E1A 60%,rgba(11,14,26,0));display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}
  .tabbar span{font-size:10px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px}
  .tabbar span.on{color:var(--cyan)}
  .tabbar .ico{width:22px;height:22px;border-radius:6px;border:2px solid currentColor}
  .runbtn{width:72px;height:72px;margin-top:-30px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(135deg,var(--cyan),var(--purple));display:grid;place-items:center;font-weight:900;font-size:13px;color:#05070F}

  /* 러닝 */
  .map{height:430px;position:relative;background:#10152A}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .timer{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start}
  .timer .t{background:rgba(11,14,26,.8);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
  .timer .t small{font-size:10px;color:var(--sub);font-weight:800;letter-spacing:2px}
  .timer .t b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px}
  .combo{background:rgba(155,107,255,.2);border:1px solid var(--purple);color:#D6C3FF;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:800;text-align:center}
  .combo b{display:block;font-size:20px;color:#fff}
  .gain{position:absolute;right:40px;top:200px;font-weight:900;font-size:18px;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
  .gain.g2{right:auto;left:150px;top:150px;color:var(--gold);text-shadow:0 0 12px var(--gold);font-size:15px}
  .runpanel{position:absolute;left:0;right:0;bottom:0;top:400px;background:var(--surface);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:18px 18px 0}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid3 div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
  .grid3 b{display:block;font-size:20px;font-weight:900}
  .grid3 span{font-size:10px;color:var(--sub);font-weight:700}
  .loot{margin-top:12px;display:flex;gap:8px}
  .loot div{flex:1;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
  .loot .xp{background:rgba(61,245,255,.1);border:1px solid rgba(61,245,255,.4);color:var(--cyan)}
  .loot .gd{background:rgba(255,200,69,.1);border:1px solid rgba(255,200,69,.4);color:var(--gold)}
  .ctrl{display:flex;gap:10px;margin-top:14px}
  .ctrl div{flex:1;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:900}
  .ctrl .p{background:var(--surface2);border:1px solid var(--line)}
  .ctrl .s{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#05070F}

  /* 캐릭터 */
  .inv{position:relative;height:330px;margin-top:4px}
  .inv svg{position:absolute;left:50%;top:20px;transform:translateX(-38%);height:250px;filter:drop-shadow(0 0 18px rgba(155,107,255,.45))}
  .inv::before{content:"";position:absolute;left:50%;bottom:36px;width:170px;height:30px;transform:translateX(-50%);border-radius:50%;border:2px solid rgba(61,245,255,.5);box-shadow:0 0 24px rgba(61,245,255,.4)}
  .col{position:absolute;top:10px;display:flex;flex-direction:column;gap:24px}
  .col.l{left:0}.col.r{right:0}
  .it{width:58px;height:58px;border-radius:14px;background:var(--surface);border:2px solid var(--line);position:relative;display:grid;place-items:center}
  .it .gl{width:28px;height:28px;border-radius:8px}
  .it.epic{border-color:var(--epic);box-shadow:0 0 12px rgba(176,107,255,.5)}.it.epic .gl{background:var(--epic)}
  .it.rare{border-color:var(--rare);box-shadow:0 0 12px rgba(77,163,255,.4)}.it.rare .gl{background:var(--rare)}
  .it.empty .gl{border:2px dashed var(--line)}
  .it i{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:11px;font-weight:900}
  .it small{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:9px;color:var(--sub);font-weight:700}
  .statbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .st{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;margin:6px 0}
  .st span{width:44px;color:var(--sub)}
  .st .bar{flex:1;height:6px}
  .st b{width:26px;text-align:right}
  .st em{font-style:normal;color:var(--cyan);font-size:11px;width:26px}
  .upg{margin-top:12px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#FF8A3D);color:#1A0F00;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900}
</style>
</head>
<body>
<section class="intro">
  <span class="tag">시안 B</span>
  <h1>다크 게임 HUD</h1>
  <p>"달리기로 키우는 게임"이라는 느낌을 가장 강하게 주는 방향입니다. 어두운 배경에 빛나는 강조색, 전투력, 아이템 등급 색, 퀘스트 목록처럼 모바일 RPG에서 익숙한 요소를 그대로 가져왔습니다.</p>
  <ul>
    <li>잘 맞는 사용자: 10~30대 게임 유저, 운동은 핑계고 성장·수집이 재미인 사람</li>
    <li>장점: 몰입감, 수집·강화 욕구, 과금 모델과 잘 맞음</li>
    <li>약점: 운동 앱으로서의 신뢰감은 약하고, 효과와 그래픽을 만드는 비용이 큼</li>
  </ul>
</section>

<svg width="0" height="0" style="position:absolute">
  <symbol id="hero" viewBox="0 0 200 260">
    <rect x="148" y="40" width="10" height="140" rx="3" fill="#3DF5FF" transform="rotate(22 153 110)"/>
    <rect x="140" y="160" width="26" height="8" rx="3" fill="#FFC845" transform="rotate(22 153 164)"/>
    <path d="M58 104 L30 214 L70 190Z" fill="#9B6BFF" opacity=".85"/>
    <rect x="78" y="168" width="20" height="66" rx="10" fill="#1E2540"/>
    <rect x="103" y="168" width="20" height="66" rx="10" fill="#1E2540"/>
    <rect x="68" y="226" width="34" height="16" rx="8" fill="#3DF5FF"/>
    <rect x="100" y="226" width="34" height="16" rx="8" fill="#3DF5FF"/>
    <rect x="46" y="108" width="20" height="62" rx="10" fill="#C99A7A" transform="rotate(12 56 108)"/>
    <rect x="134" y="108" width="20" height="62" rx="10" fill="#C99A7A" transform="rotate(-12 144 108)"/>
    <rect x="62" y="98" width="76" height="86" rx="26" fill="#2E3760" stroke="#9B6BFF" stroke-width="3"/>
    <path d="M100 112 L112 132 L100 152 L88 132Z" fill="#3DF5FF"/>
    <circle cx="100" cy="64" r="40" fill="#E0B090"/>
    <path d="M58 64 Q60 16 100 18 Q142 16 142 64 L132 48 L120 58 L108 40 L96 56 L84 40 L72 56Z" fill="#E9ECFF"/>
    <circle cx="86" cy="72" r="5" fill="#0B0E1A"/><circle cx="114" cy="72" r="5" fill="#0B0E1A"/>
    <circle cx="87.5" cy="70.5" r="1.6" fill="#3DF5FF"/><circle cx="115.5" cy="70.5" r="1.6" fill="#3DF5FF"/>
    <path d="M91 88 Q100 93 109 88" stroke="#0B0E1A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="row">
  <!-- 홈 -->
  <figure class="shot">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="scroll">
        <div class="hud">
          <div class="avatar"><b>2</b></div>
          <div class="who"><b>러너1호</b><span>브론즈 러너</span></div>
          <div class="cur"><span><i class="coin"></i>1,274</span><span><i class="gem"></i>35</span></div>
        </div>
        <div class="arena">
          <div class="cp"><small>전투력</small><b>1,240</b></div>
          <span class="grade">다음 레벨까지 8분</span>
          <svg><use href="#hero"/></svg>
        </div>
        <div class="xpbar">EXP<div class="bar"><i style="width:62%"></i></div>124/200</div>
        <div class="sec">오늘의 퀘스트 <span>초기화까지 14:22:05</span></div>
        <div class="qst"><div class="ic">🏃</div><div class="t"><b>3km 달리기</b><div class="bar"><i style="width:62%"></i></div></div><div class="rw"><i class="coin"></i>100</div></div>
        <div class="qst"><div class="ic">👟</div><div class="t"><b>5,000걸음 걷기</b><div class="bar"><i style="width:84%"></i></div></div><div class="rw"><i class="gem"></i>5</div></div>
        <div class="qst done"><div class="ic">✔</div><div class="t"><b>앱 접속하기</b><div class="bar"><i style="width:100%"></i></div></div><div class="rw">완료</div></div>
      </div>
      <div class="tabbar">
        <span class="on"><i class="ico"></i>로비</span>
        <span><i class="ico"></i>랭킹</span>
        <div class="runbtn">RUN</div>
        <span><i class="ico"></i>상점</span>
        <span><i class="ico"></i>가방</span>
      </div>
    </div>
    <figcaption>로비 — 캐릭터와 퀘스트</figcaption>
  </figure>

  <!-- 러닝 -->
  <figure class="shot">
    <div class="phone">
      <div class="map">
        <svg viewBox="0 0 340 430" preserveAspectRatio="none">
          <g stroke="#1B2240" stroke-width="16" fill="none"><path d="M-10 100 H350"/><path d="M-10 280 H350"/><path d="M80 -10 V440"/><path d="M250 -10 V440"/></g>
          <g stroke="#1B2240" stroke-width="7" fill="none"><path d="M-10 190 H350"/><path d="M165 -10 V440"/></g>
          <path d="M80 420 V280 H165 V190 H250 V110" stroke="#3DF5FF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #3DF5FF)"/>
          <circle cx="250" cy="110" r="14" fill="#9B6BFF" stroke="#fff" stroke-width="4"/>
          <circle cx="165" cy="235" r="8" fill="#FFC845"/><circle cx="210" cy="190" r="8" fill="#FFC845"/>
        </svg>
        <div class="timer">
          <div class="t"><small>TIME</small><b>05:32</b></div>
          <div class="combo">연속 달리기<b>x1.2</b></div>
        </div>
        <div class="gain">+10 EXP</div>
        <div class="gain g2">+12 G</div>
      </div>
      <div class="runpanel">
        <div class="grid3">
          <div><b>0.84</b><span>km</span></div>
          <div><b>1,102</b><span>걸음</span></div>
          <div><b>6'35"</b><span>페이스</span></div>
        </div>
        <div class="loot">
          <div class="xp"><span>경험치</span><span>+55</span></div>
          <div class="gd"><span>골드</span><span>+110</span></div>
        </div>
        <div class="ctrl"><div class="p">일시정지</div><div class="s">완료</div></div>
      </div>
    </div>
    <figcaption>러닝 — 길 위의 골드를 줍는 느낌</figcaption>
  </figure>

  <!-- 캐릭터 -->
  <figure class="shot">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="scroll">
        <div class="hud">
          <div class="who"><b style="font-size:20px">장비</b><span>전투력 1,240</span></div>
          <div class="cur"><span><i class="coin"></i>1,274</span><span><i class="gem"></i>35</span></div>
        </div>
        <div class="inv">
          <div class="col l">
            <div class="it rare"><span class="gl"></span><i>+3</i><small>머리</small></div>
            <div class="it epic"><span class="gl"></span><i>+1</i><small>상의</small></div>
            <div class="it empty"><span class="gl"></span><small>장갑</small></div>
          </div>
          <svg><use href="#hero"/></svg>
          <div class="col r">
            <div class="it epic"><span class="gl"></span><i>+5</i><small>무기</small></div>
            <div class="it rare"><span class="gl"></span><i>+2</i><small>하의</small></div>
            <div class="it rare"><span class="gl"></span><i>+5</i><small>신발</small></div>
          </div>
        </div>
        <div class="statbox">
          <div class="st"><span>공격력</span><div class="bar"><i style="width:45%"></i></div><b>128</b><em>+12</em></div>
          <div class="st"><span>체력</span><div class="bar"><i style="width:70%"></i></div><b>940</b><em></em></div>
          <div class="st"><span>속도</span><div class="bar"><i style="width:35%"></i></div><b>42</b><em>+3</em></div>
        </div>
        <div class="upg">⚡ 무기 +6 강화 · <i class="coin"></i> 320</div>
      </div>
    </div>
    <figcaption>장비 — 등급 색이 있는 RPG 인벤토리</figcaption>
  </figure>
</div>
</body>
</html>
