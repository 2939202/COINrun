<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 2 · 주홍 인장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Song+Myung&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
  :root{
    --bg:#FAF7F1; --ink:#141414; --sub:#8B8680; --line:#E9E5DE; --card:#F2ECE1;
    --acc:#D1432F; --page:#EAE3D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,system-ui,sans-serif;background:var(--page);color:var(--ink);padding:40px 16px 60px}
  .intro{max-width:1140px;margin:0 auto 32px}
  .intro .tag{display:inline-block;background:var(--acc);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
  .intro h1{font-size:40px;font-weight:900;letter-spacing:-1.5px;margin:12px 0 8px}
  .intro h1 .sw{display:inline-block;width:26px;height:26px;border-radius:8px;background:var(--acc);vertical-align:2px;margin-left:10px}
  .intro p{color:#555;font-size:16px;line-height:1.6;max-width:760px}
  .intro ul{margin-top:12px;padding-left:18px;color:#555;line-height:1.8;font-size:15px}
  .row{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .shot{display:flex;flex-direction:column;align-items:center;gap:14px}
  .shot figcaption{font-weight:700;font-size:15px}
  .phone{width:360px;height:760px;border-radius:46px;border:10px solid #141414;background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.16)}
  .status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:13px;font-weight:700}
  .scroll{padding:0 20px}

  /* 타이틀 */
  .brand{display:flex;align-items:center;justify-content:space-between;margin:2px 0 2px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .t{font-family:'Song Myung',serif;font-size:36px;line-height:1;letter-spacing:-1px}
  .logo .seal{border:2.5px solid var(--acc);color:var(--acc);border-radius:4px;padding:3px 5px;font-size:11px;font-weight:900;letter-spacing:1px;transform:rotate(-4deg)}
  .hi{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:14px}
  .hi b{color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px}
  .coin{width:16px;height:16px;border-radius:50%;background:#E8B64A;border:2px solid #141414}

  /* 홈 */
  .hero{position:relative;height:282px;border-radius:24px;background:var(--card);overflow:hidden}
  .hero,.stage{box-shadow:inset 0 0 0 1.5px #D9CFBF}
  .deco{position:absolute;inset:0;width:100%;height:100%}
  .hero .han{position:absolute;right:-8px;bottom:-30px;font-family:'Song Myung',serif;font-size:210px;line-height:1;color:var(--ink);opacity:.045}
  .hero .lv{position:absolute;left:20px;top:16px}
  .hero .lv small{display:block;font-size:11px;font-weight:800;letter-spacing:3px;color:var(--sub)}
  .hero .lv b{font-size:72px;font-weight:900;line-height:.9;letter-spacing:-4px}
  .hero .tier{position:absolute;right:16px;top:18px;background:var(--acc);color:#fff;font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px}
  svg.ch{position:absolute;left:50%;transform:translateX(-35%)}
  .hero svg.ch{bottom:34px;height:220px}
  .hero .xp{position:absolute;left:20px;right:20px;bottom:14px}
  .bar{height:6px;border-radius:999px;background:rgba(0,0,0,.09);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
  .hero .xp span{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#555;margin-top:6px}
  .sec{font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--sub);margin:18px 0 10px}
  .stats{display:flex;justify-content:space-between}
  .stats div b{display:block;font-size:25px;font-weight:900;letter-spacing:-1px}
  .stats div span{font-size:12px;color:var(--sub);font-weight:600}
  .quest{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--line);border-radius:18px;background:#fff}
  .quest .ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--acc) 0 62%,var(--line) 62% 100%);display:grid;place-items:center}
  .quest .ring::after{content:"";width:30px;height:30px;border-radius:50%;background:#fff}
  .quest b{font-size:15px}
  .quest p{font-size:12px;color:var(--sub);margin-top:2px}
  .quest em{margin-left:auto;font-style:normal;font-weight:800;font-size:13px;color:var(--acc)}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:10px}
  .tabbar span{font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px}
  .tabbar span.on{color:var(--ink)}
  .tabbar .ico{width:22px;height:22px;border-radius:6px;border:2px solid currentColor}
  .start{width:66px;height:66px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;font-size:14px;display:grid;place-items:center;margin-top:-34px;box-shadow:0 8px 20px rgba(0,0,0,.2);border:4px solid var(--bg)}

  /* 러닝 */
  .map{height:390px;background:#ECE8E0;position:relative}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .map .back{position:absolute;left:16px;top:12px;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .map .gps{position:absolute;right:16px;top:12px;background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .panel{padding:18px 22px 0;text-align:center}
  .panel .time{font-size:76px;font-weight:900;letter-spacing:-4px;line-height:1}
  .panel .label{font-size:12px;color:var(--sub);font-weight:700;margin-top:4px}
  .panel .stats{margin:18px 4px 0;text-align:center}
  .reward{margin-top:16px;background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;display:flex;justify-content:space-between;font-weight:800;font-size:14px}
  .reward em{font-style:normal;color:#FF8A73}
  .ctrl{display:flex;justify-content:center;gap:26px;margin-top:20px}
  .ctrl div{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px}
  .ctrl .pause{background:var(--acc);color:#fff}
  .ctrl .stop{border:2px solid var(--ink)}

  /* 캐릭터 */
  .charhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
  .charhead h2{font-size:24px;font-weight:900}
  .stage{height:250px;border-radius:24px;background:var(--card);position:relative;overflow:hidden}
  .stage svg.ch{bottom:16px;height:212px}
  .stage .power{position:absolute;left:18px;top:16px}
  .stage .power small{font-size:11px;color:var(--sub);font-weight:800;letter-spacing:2px}
  .stage .power b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px}
  .statrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;font-weight:700}
  .statrow .hz{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:'Song Myung',serif;font-size:14px;font-style:normal}
  .statrow span{width:44px;color:var(--sub)}
  .statrow .bar{flex:1;height:8px}
  .statrow b{width:28px;text-align:right}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .slot{aspect-ratio:1;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;font-size:11px;font-weight:700;color:var(--sub)}
  .slot .gl{width:26px;height:26px;border-radius:8px;background:#fff;border:2px solid var(--ink)}
  .slot.eq{background:var(--ink);color:#fff}
  .slot.eq .gl{background:var(--acc);border-color:var(--acc)}
  .slot i{position:absolute;right:6px;top:5px;font-style:normal;font-size:10px;font-weight:900;color:#FF8A73}
  .cta{margin:16px 0 0;height:56px;border-radius:999px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px}
  .cta .coin{border-color:#fff}
</style>
</head>
<body>
<section class="intro">
  <span class="tag">시안 2</span>
  <h1>주홍 · 인장<span class="sw"></span></h1>
  <p>도장에 찍는 인주 색인 <b>주홍</b>을 포인트 색으로 썼습니다. 타이틀은 <b>명조 계열 글꼴</b>로 단정하게 쓰고, 테두리 도장 모양의 RPG 표시를 붙였습니다. 캐릭터 배경 모서리에 <b>구름무늬</b>를 옅게 넣었습니다.</p>
  <ul><li>동양 느낌이 드는 곳: 명조 타이틀, 테두리 도장, 구름무늬, 한지 같은 따뜻한 배경색</li><li>느낌: 셋 중 가장 전통적이고 차분함</li><li>주의: 주홍은 경고나 오류 색과 겹칠 수 있어 오류 표시는 다른 색으로 구분</li></ul>
</section>

<svg width="0" height="0" style="position:absolute">
  <symbol id="runner" viewBox="0 0 200 260">
    <ellipse cx="100" cy="248" rx="54" ry="8" fill="rgba(0,0,0,.12)"/>
    <!-- 등 뒤의 검과 술 -->
    <rect x="148" y="46" width="8" height="128" rx="3" fill="#6E6A64" transform="rotate(24 152 110)"/>
    <rect x="136" y="150" width="26" height="7" rx="3" fill="#141414" transform="rotate(24 149 153)"/>
    <path d="M126 176 q-4 14 2 26" stroke="#D1432F" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="78" y="168" width="20" height="66" rx="10" fill="#2A2A2A"/>
    <rect x="103" y="168" width="20" height="66" rx="10" fill="#2A2A2A"/>
    <rect x="68" y="226" width="34" height="16" rx="8" fill="#D1432F" stroke="#141414" stroke-width="3"/>
    <rect x="100" y="226" width="34" height="16" rx="8" fill="#D1432F" stroke="#141414" stroke-width="3"/>
    <rect x="46" y="108" width="20" height="62" rx="10" fill="#F0CBA6" transform="rotate(12 56 108)"/>
    <rect x="134" y="108" width="20" height="62" rx="10" fill="#F0CBA6" transform="rotate(-12 144 108)"/>
    <!-- 도복 느낌의 여밈 옷깃과 허리띠 -->
    <rect x="62" y="98" width="76" height="86" rx="28" fill="#141414"/>
    <path d="M82 100 L100 136 L118 100" stroke="#F4F1EA" stroke-width="5" fill="none" stroke-linejoin="round"/>
    <rect x="62" y="146" width="76" height="11" fill="#D1432F"/>
    <path d="M86 157 l-6 20 M92 157 l0 18" stroke="#D1432F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="64" r="40" fill="#F0CBA6"/>
    <path d="M60 60 Q64 20 100 22 Q138 20 140 60 Q126 44 100 44 Q76 44 60 60Z" fill="#1E1E1E"/>
    <!-- 휘날리는 머리띠 -->
    <rect x="60" y="46" width="80" height="10" rx="5" fill="#D1432F"/>
    <path d="M60 51 Q40 44 26 56 M60 53 Q44 60 30 72" stroke="#D1432F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="86" cy="72" r="4.5" fill="#141414"/><circle cx="114" cy="72" r="4.5" fill="#141414"/>
    <path d="M90 88 Q100 95 110 88" stroke="#141414" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="row">
  <figure class="shot">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="scroll">
        <div class="brand"><div class="logo"><span class="t">달리랑</span><span class="seal">RPG</span></div><span class="pill"><span class="coin"></span>1,274</span></div>
        <div class="hi">좋은 아침이에요, <b>러너1호</b> 님</div>
        <div class="hero">
          <svg class="deco" viewBox="0 0 320 282" preserveAspectRatio="none"><g fill="none" stroke="#D1432F" stroke-width="2.2" opacity=".28" stroke-linecap="round"><path d="M-6 250 q18 -26 40 -8 q10 -22 32 -6 q16 -14 30 4"/><path d="M8 264 q14 -14 28 -2"/><path d="M210 40 q14 -22 34 -8 q10 -18 30 -4 q18 -10 34 8"/><path d="M232 56 q12 -12 26 0"/></g></svg>
          <div class="han">走</div>
          <div class="lv"><small>LEVEL</small><b>2</b></div>
          <span class="tier">수련생</span>
          <svg class="ch"><use href="#runner"/></svg>
          <div class="xp"><div class="bar"><i style="width:62%"></i></div><span><em style="font-style:normal">124 / 200 EXP</em><em style="font-style:normal">다음 레벨까지 8분</em></span></div>
        </div>
        <div class="sec">이번 주</div>
        <div class="stats">
          <div><b>12.4</b><span>킬로미터</span></div>
          <div><b>1:48</b><span>움직인 시간</span></div>
          <div><b>15,230</b><span>걸음</span></div>
        </div>
        <div class="sec">오늘의 수련</div>
        <div class="quest"><div class="ring"></div><div><b>3km 달리기</b><p>1.86 / 3.00 km</p></div><em>+100 G</em></div>
      </div>
      <div class="tabbar">
        <span class="on"><i class="ico"></i>홈</span>
        <span><i class="ico"></i>기록</span>
        <div class="start">출발</div>
        <span><i class="ico"></i>상점</span>
        <span><i class="ico"></i>캐릭터</span>
      </div>
    </div>
    <figcaption>홈 — 타이틀과 캐릭터</figcaption>
  </figure>

  <figure class="shot">
    <div class="phone">
      <div class="map">
        <svg viewBox="0 0 340 390" preserveAspectRatio="none">
          <g stroke="#FFFFFF" stroke-width="14" fill="none"><path d="M-10 90 H350"/><path d="M-10 250 H350"/><path d="M80 -10 V400"/><path d="M250 -10 V400"/></g>
          <g stroke="#FFFFFF" stroke-width="6" fill="none"><path d="M-10 170 H350"/><path d="M165 -10 V400"/><path d="M-10 330 L350 300"/></g>
          <rect x="95" y="105" width="55" height="50" rx="6" fill="#DDE5D3"/><rect x="180" y="185" width="55" height="50" rx="6" fill="#DDE5D3"/>
          <path d="M80 360 V250 H165 V170 H250 V95" stroke="#141414" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="250" cy="95" r="11" fill="#D1432F" stroke="#fff" stroke-width="5"/>
        </svg>
        <div class="back">←</div>
        <div class="gps">GPS 양호</div>
      </div>
      <div class="panel">
        <div class="time">05:32</div>
        <div class="label">시간</div>
        <div class="stats">
          <div><b>0.84</b><span>킬로미터</span></div>
          <div><b>1,102</b><span>걸음</span></div>
          <div><b>6'35"</b><span>페이스</span></div>
        </div>
        <div class="reward"><span>이번 수련 보상</span><span><em>+55 EXP</em> · +110 G</span></div>
        <div class="ctrl"><div class="pause">II</div><div class="stop">완료</div></div>
      </div>
    </div>
    <figcaption>러닝 중 — 보상이 실시간으로 쌓임</figcaption>
  </figure>

  <figure class="shot">
    <div class="phone">
      <div class="status"><span>9:41</span><span>●●● ▮</span></div>
      <div class="scroll">
        <div class="charhead"><h2>내 캐릭터</h2><span class="pill"><span class="coin"></span>1,274</span></div>
        <div class="stage">
          <svg class="deco" viewBox="0 0 320 282" preserveAspectRatio="none"><g fill="none" stroke="#D1432F" stroke-width="2.2" opacity=".28" stroke-linecap="round"><path d="M-6 250 q18 -26 40 -8 q10 -22 32 -6 q16 -14 30 4"/><path d="M8 264 q14 -14 28 -2"/><path d="M210 40 q14 -22 34 -8 q10 -18 30 -4 q18 -10 34 8"/><path d="M232 56 q12 -12 26 0"/></g></svg>
          <div class="power"><small>전투력</small><b>1,240</b></div>
          <svg class="ch"><use href="#runner"/></svg>
        </div>
        <div class="sec">능력치</div>
        <div class="statrow"><i class="hz">力</i><span>힘</span><div class="bar"><i style="width:40%"></i></div><b>12</b></div>
        <div class="statrow"><i class="hz">氣</i><span>지구력</span><div class="bar"><i style="width:65%"></i></div><b>19</b></div>
        <div class="statrow"><i class="hz">速</i><span>속도</span><div class="bar"><i style="width:30%"></i></div><b>9</b></div>
        <div class="sec">장비</div>
        <div class="slots">
          <div class="slot eq"><i>+3</i><span class="gl"></span>머리띠</div>
          <div class="slot eq"><i>+1</i><span class="gl"></span>도복</div>
          <div class="slot eq"><i>+5</i><span class="gl"></span>신발</div>
          <div class="slot"><span class="gl"></span>검</div>
        </div>
        <div class="cta">신발 +6 강화하기 · <span class="coin"></span> 320</div>
      </div>
    </div>
    <figcaption>캐릭터 — 능력치와 장비 강화</figcaption>
  </figure>
</div>
</body>
</html>
